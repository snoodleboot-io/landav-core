[package]
name = "landav-cli"
description = "The landav command-line interface: check, explain, calibrate. Free forever."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "landav"
path = "src/main.rs"

[dependencies]
landav-bound = { workspace = true }
landav-calibrate = { workspace = true }
# The lowering, for `--coverage`. Language-neutral: `landav-its` owns the
# refusal vocabulary and the coverage report, `landav-python` owns the
# translation into it, and this crate learns no Python fact from either.
landav-its = { workspace = true }
landav-python = { workspace = true }
# The native bound engine, for `--bounds`. Reads the structured program rather
# than the lowered system, so this needs no solver on PATH - which is why the
# flag can be answered offline.
landav-engine = { workspace = true }
landav-solvers = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# Derives the machine-readable run shape in `machine.rs`. `serde_json` alone
# would mean hand-building every value, which is exactly where a field quietly
# stops matching its documentation.
serde = { workspace = true }
thiserror = { workspace = true }

# Configuration is read from `pyproject.toml`, which is TOML, so a TOML reader
# is not optional. Declared here rather than in `[workspace.dependencies]`
# because no other crate parses configuration; promote it centrally the moment
# a second one does, so two lanes cannot resolve different versions.
toml = "0.9"

[dev-dependencies]
# Test-only. The acceptance tests build throwaway project trees (config files,
# symlink loops, unreadable files) and must not leave them behind when a test
# fails, so the scratch directory owns its own cleanup.
tempfile = "3.27"

[lints]
workspace = true
