[package]
name = "landav-fdk"
description = "The Landav Frontend Development Kit: the published plugin boundary for language frontends and for landav-ee extensions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
landav-bound = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Signature packs are TOML: diffable in review, and it takes comments, which is
# what makes the required `why` field readable as prose rather than as a string
# literal. Not a new dependency in the tree - `landav-cli` already reads
# `pyproject.toml` with the same crate at the same version.
toml = "0.9"

[lints]
workspace = true
