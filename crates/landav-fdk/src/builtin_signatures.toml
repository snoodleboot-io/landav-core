# ---------------------------------------------------------------------------
# refused — written down so a later contributor argues rather than appends
# ---------------------------------------------------------------------------

[[signature]]
callee = "join"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = true
why = """
Walks its argument and allocates a result whose length is the sum of the parts.
Linear in a size this analysis cannot see. That is LAN-11's size analysis, not a
signature, and a constant declared here would be a bound the program exceeds. 56
typed sole-blocked sites — the temptation is the point of writing this down.
"""

[[signature]]
callee = "sorted"
cost = "loglinear"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
n log n in its argument's length, plus a comparison per step which may itself be
user code. Two unbounded things at once — so the cost stays unresolvable and the
call site stays a hole.

The LENGTH is a different claim and it is known exactly: sorted() copies its
argument into a list and then permutes it, so the result holds exactly as many
values as the argument did at the moment of the call. A comparison that mutates
the argument cannot change that — the list is already built — which is why the
trip count of `for r in sorted(records)` is a reading of the state BEFORE this
call, and why the frontend charges this hole after the loop rather than in front
of it. LAN-99.
"""

[[signature]]
callee = "list"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
Copies its argument, one element per element, so the copy holds exactly as many
values as the original — a length relation, declared beside a cost that stays
unresolvable. 14 stdlib sole-blocked sites and every one of them is linear
in something. `list()` with no argument is constant, but a row keyed by name
cannot tell the two apart and the frontend does not look at arity for a refused
row.
"""

[[signature]]
callee = "print"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
why = """
I/O. Formats every argument — which runs their `__str__`, arbitrary user code —
and then writes to a stream that may block. Unbounded by anything this analysis
can see. 12 stdlib sole-blocked sites.
"""

[[signature]]
callee = "append"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
why = """
Not merely unbounded — not SAFE. It mutates the collection, so a length read
before it is not the length a loop after it walks, and collection_length.rs
depends on that entry length being forgotten. Amortised O(1) is the right answer
to a different question.
"""

[[signature]]
callee = "decode"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = true
why = """
Allocates a string whose size is the input's length, and the codec doing it may
be a user-registered one. Linear at best.
"""

[[signature]]
callee = "__enter__"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
why = """
96 typed sole-blocked sites, the most tempting row in the file, and it must stay
refused: this is landav's own hole from LAN-92's `with` support, not something
the user wrote, and it is a call to arbitrary user code. A lock's `__enter__`
blocks indefinitely. There is no bound to declare.
"""

[[signature]]
callee = "__exit__"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
why = """
The other half of the same statement, with the same 96 sites and the same
argument. A `__exit__` that suppresses an exception also changes the control
flow, which is a second reason beyond the cost.
"""

# ---------------------------------------------------------------------------
# length relations — LAN-99
# ---------------------------------------------------------------------------
#
# Every row below declares `result_length`. Read the header note first: that
# column is a claim about how many values come BACK, and it is independent of
# the `cost` column beside it. `sorted` above carries a relation and stays a
# hole; `enumerate` below carries a relation and is discharged. The two columns
# were separated so those two rows could both be written honestly.
#
# The relation is conditional on the ARGUMENT, never a property of the name. A
# frontend may only use it where argument 0 is something whose length the caller
# supplies — for landav-python, a parameter annotated with a sized builtin, or
# another length relation bottoming out in one. `enumerate(stream())` and
# `enumerate(r for r in xs if p(r))` confer nothing, and neither does `d.items()`
# where `d` came from a call.
#
# What is NOT here, and why:
#
#   splitlines  len(s.splitlines()) is the number of NEWLINES in s, not len(s).
#               It appears in the length-preserving corpus tally by shape and is
#               not length-preserving at all.
#   dict        dict(pairs) collapses equal keys, so it would be at-most — but
#               dict(**kwargs) and dict(mapping) are three different callees
#               wearing one name and the arity check would have to grow first.
#   zip         min() of its arguments' lengths, which is neither an equality
#               with argument 0 nor an upper bound BY argument 0 in the sense
#               this column means — min is <= argument 0, so at-most-argument0
#               would be sound, but zip's whole point is several arguments and a
#               column that names one of them describes it badly. LAN-11.
#   filter      yields FEWER values than it reads, decided by user code it also
#               runs once per element. Two reasons, either sufficient.
#   map         yields exactly as many, and runs arbitrary user code on every
#               one of them. The length claim would be true and would arrive
#               attached to a call whose cost is whatever `fn` costs; admitting
#               it would mean a complete-looking bound for a program that calls
#               something len(records) times. When the cost half can be stated,
#               this row can be written.

[[signature]]
callee = "enumerate"
cost = "constant"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
Wraps its argument and returns; the pairs are produced one at a time by the loop
that consumes it, so constructing one is O(1) and it yields exactly as many
values as the argument holds. 44 stdlib loops, the second-largest
length-preserving shape in the corpus. The loose end is `iter()` on a user
object, which runs `__iter__` — the same loose end `bool`'s row already accepts
for `__len__`, and the length relation is in any case gated on the argument
being a sized builtin the caller supplied.
"""

[[signature]]
callee = "reversed"
cost = "constant"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
Returns a reverse iterator over the same elements: no copy, no comparison, the
same count. Constant for the same reason as `enumerate` and with the same loose
end, `__reversed__` on a user object, gated the same way.
"""

[[signature]]
callee = "tuple"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
The immutable sibling of `list`: copies its argument element for element, so the
cost is linear in a size this analysis cannot see and the result holds exactly as
many values as the original.
"""

[[signature]]
callee = "set"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = true
result_length = "at-most-argument0"
why = """
AT MOST, and the distinction is the point: `set([1, 1, 2])` reads three values and
holds two, so a loop over it runs at most len(argument) times and possibly fewer.
An equality here would be a false Theta, which is the same error LAN-91 refused
for the `{1, 1, 2}` display, and Theta against O is a difference this tool prints
for its users. Hashing every element is linear at best and runs `__hash__` and
`__eq__`, which are user code, so the cost stays unresolvable.
"""

[[signature]]
callee = "frozenset"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = true
result_length = "at-most-argument0"
why = """
The same collapse with the same argument as `set`. Admitting one and not the
other would leave a user rewriting a frozenset as a set to get a bound.
"""

[[signature]]
callee = "items"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
The largest length-preserving shape in the corpus — 57 stdlib loops, 58 on the
typed one — and the first row whose relation has to bite on a bare ATTRIBUTE
rather than a bare name. Argument 0 of a method row is its RECEIVER, so
`len(d.items()) == len(d)` needs no new vocabulary.

The cost is a separate matter and stays refused. `dict.items()` really is O(1),
but a row keyed by name matches ANY object's `.items()`, and a frontend resolving
the cost of an arbitrary receiver's method would be declaring a bound for code
the pack has never seen — the caveat every method row in this file already
carries. The LENGTH claim is safe where the cost claim is not, because the
frontend may only use it when the receiver is a collection the caller supplied,
which is a far stronger gate than the name.
"""

[[signature]]
callee = "keys"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
A dict has exactly as many keys as it has entries. Same receiver-as-argument-0
reading, same gate, and the same refusal on the cost side as `items`.
"""

[[signature]]
callee = "values"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
result_length = "exactly-argument0"
why = """
And exactly as many values, one per entry, duplicates included — `values()` does
NOT collapse equal values the way `set` does, so this is an equality and not an
upper bound. Same gate and same cost refusal as `items`.
"""

# ---------------------------------------------------------------------------
# LAN-103 — cannot rebind a local; cost unresolvable; the call STAYS a hole
# ---------------------------------------------------------------------------
#
# None of these is resolvable: every cost below is `unbounded` or linear in a
# size this analysis cannot see. What a row here buys is the OTHER field. A
# refused call carrying `rebinds_locals = false` forgets no local of the
# caller's frame (`landav_its::Writes`), so a loop below it keeps the trip
# count it read above it. Measured on the typed corpus after LAN-100: 13 of
# the 42 still-uncounted loops over a sized parameter were blocked by exactly
# one of these calls and nothing else.
#
# `mutates_arguments` is `true` for every constructor: `list(x)` runs
# `x.__iter__` and `set(x)` runs each element's `__hash__`, and both are user
# code. It is `false` for the str and container methods below, and that is the
# one place a row here is stronger than LAN-94's: the frontend matches a method
# row only on a receiver that is a parameter annotated with the builtin and
# never rebound, and `list.copy` and `str.split` on a builtin receiver run no
# user code at all - no element method, no hash, no comparison. A length read
# on entry survives them, which is what the ticket was measured on.

[[signature]]
callee = "map"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
why = "Builds a lazy iterator, but calls iter() on every iterable argument at construction, which is user code; consuming it runs the function once per element. Runs in its own frame."

[[signature]]
callee = "dict"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = true
result_length = "at-most-argument0"
why = "Copies its argument's entries, hashing each key with user code. Duplicate keys collapse, so the result is at most as long as the argument. Runs in its own frame."

[[signature]]
callee = "defaultdict"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
why = "defaultdict(list) is a constant; defaultdict(list, mapping) copies the mapping. One row covers both spellings by claiming the weaker cost. Runs in its own frame."

[[signature]]
callee = "copy"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = false
result_length = "exactly-argument0"
why = "A shallow copy of the receiver, one slot per element, copying references and calling nothing on them. Matched only on a receiver that is a parameter annotated with a builtin collection and never rebound, so this is the builtin's copy and runs no user code."

[[signature]]
callee = "split"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = false
why = "One pass over the receiver string, calling nothing. Matched only on a receiver annotated str and never rebound, so this is str.split and runs no user code; a user class's split is not this row."

[[signature]]
callee = "strip"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = false
why = "One pass over the receiver string from each end, calling nothing. Receiver rule as for split."

[[signature]]
callee = "lstrip"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = false
why = "One pass over the receiver string from the left, calling nothing. Receiver rule as for split."

[[signature]]
callee = "lower"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = false
why = "One pass over the receiver string, calling nothing. Receiver rule as for split."

[[signature]]
callee = "upper"
cost = "linear-in-argument"
rebinds_locals = false
mutates_arguments = false
why = "One pass over the receiver string, calling nothing. Receiver rule as for split."

[[signature]]
callee = "get"
cost = "unbounded"
rebinds_locals = false
mutates_arguments = true
why = "A hash lookup on the receiver, and hashing the key is user code. Matched only on a receiver annotated dict."
