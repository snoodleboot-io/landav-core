[package]
name = "landav-bound"
description = "The Landav bound algebra and cost semiring registry: the vocabulary every analysis tier emits into."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Exposes the law suite outside `cfg(test)` so that a `Dioid` instance defined
# in another crate inherits the identical conformance suite. This is what makes
# "law tests run for every instance" hold beyond this crate's own boundary.
laws = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

# The LAN-56 acceptance criteria are property tests (`tests/properties/`), not
# example tests: weak monotonicity and composition-by-substitution soundness
# are properties, and a handful of examples will not catch a violation.
[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
