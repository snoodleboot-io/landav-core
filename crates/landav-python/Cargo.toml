[package]
name = "landav-python"
description = "The Python frontend: parser, type resolution, lowering and pattern rules. The reference FDK implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
landav-bound = { workspace = true }
landav-fdk = { workspace = true }
landav-its = { workspace = true }
thiserror = { workspace = true }

# The Python 3 parser behind `analyze_source`.
#
# Declared here rather than in the workspace manifest: `[workspace.dependencies]`
# is written by several live M0 lanes at once, and this is the only crate that
# may know anything about Python (F-005's frontend boundary).
#
# `ruff_python_parser` is the parser, since `LAN-130`. It replaced
# `rustpython-parser 0.4.0`, which was chosen here for a reason that has since
# expired and then died: it was "a maintained, self-contained release" where
# Ruff's crate was "a long-stale 0.0.8 placeholder". Today `rustpython-parser`
# has not shipped since 2024-08-06, 0.4.0 is the last release it will ever
# have, and it predates PEP 701 - so it cannot read three files of the 3.12
# standard library, and nothing of 3.13, 3.14 or 3.15 at all.
#
# The trade is honest and worth stating: this crate is `0.0.x`, published from
# Ruff's internals with no API-stability promise, so it will churn. A parser
# that churns is worth more than one that cannot read the language. When it
# breaks, it breaks at compile time in this crate and nowhere else - the
# `F-005` frontend boundary is what makes that true, and `LAN-130` measured it
# (6 files here, 3 test files, and no other crate in the workspace).
#
# No feature flag for ranges: every node carries a byte-offset `TextRange`,
# which is what `Location`'s byte-column contract needs. `rustpython-parser`
# needed `all-nodes-with-ranges` for the same guarantee.
ruff_python_parser = "0.0.20"
ruff_python_ast = "0.0.20"
ruff_text_size = "0.0.20"

[lints]
workspace = true
